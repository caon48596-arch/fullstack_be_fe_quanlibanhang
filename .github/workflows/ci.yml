name: IPWORLD CI (Backend & Frontend)

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend-test:
    name: Backend - Maven Build & Tests (Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "demo (7)/demo"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Run Unit, API & Integration Tests
        run: chmod +x mvnw && ./mvnw test -B

  frontend-build:
    name: Frontend - Lint & Production Build (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "frontend/frontend-quanlybanhang"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/frontend-quanlybanhang/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: Build Next.js production bundle
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8081/api
        run: npm run build
