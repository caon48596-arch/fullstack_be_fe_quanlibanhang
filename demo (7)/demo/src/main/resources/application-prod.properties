# ===================================================================
# PRODUCTION PROFILE (Kích hoạt bằng SPRING_PROFILES_ACTIVE=prod)
# ===================================================================

# Tuyệt đối tắt Hibernate auto-DDL trên Production — chỉ cho phép validate khớp với Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway Migration nghiêm ngặt trên Production
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/{vendor}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false

# Bảo mật Cookie & CORS trên Production (bắt buộc HTTPS + domain whitelist qua env)
app.cookie.secure=true
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://ipworld.vn}

# Redis (1 Node) cho Cache, OTP, Rate Limit & JWT Blacklist trên Production
app.cache.type=redis
management.health.redis.enabled=true
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2s
