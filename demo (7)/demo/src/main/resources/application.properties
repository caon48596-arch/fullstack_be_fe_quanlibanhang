spring.application.name=demo
server.port=8081

# Tắt tự động gọi Docker khi khởi động dự án
spring.docker.compose.enabled=false

# ===============================
# DATASOURCE CONFIGURATION (Có tham số tự động tạo DB)
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/qlbanhang_db?allowPublicKeyRetrieval=true&useSSL=false&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# CONNECTION POOL (HIKARICP - Chuẩn Production)
# ===============================
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

