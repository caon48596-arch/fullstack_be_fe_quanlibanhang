spring.application.name=ipworld-api
server.port=8081

# Tắt tự động gọi Docker Compose khi khởi động
spring.docker.compose.enabled=false

# Structured Correlation ID trong Log (X-Request-Id MDC)
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-system}] [%thread] %logger{36} - %msg%n

# Datasource (ưu tiên biến môi trường khi deploy production)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/qlbanhang_db?allowPublicKeyRetrieval=true&useSSL=false&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# JPA / Hibernate (KHÔNG dùng ddl-auto=update; schema do Flyway quản lý và Hibernate chỉ validate)
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Flyway Database Schema Migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/{vendor}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true

# JWT (Access Token ngắn 15 phút + Refresh Token Rotation 7 ngày qua HttpOnly Cookie)
jwt.secret=${JWT_SECRET:8f8f9f1011121314151617181920212223242526272829303132333435363738}
jwt.expiration=${JWT_EXPIRATION:900000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}
app.cookie.secure=${COOKIE_SECURE:false}

# CORS Whitelist (tuyệt đối không dùng wildcard * kết hợp allowCredentials=true)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

# Payment Webhook & Order Expiration + Outbox Relay
app.payment.webhook-secret=${PAYMENT_WEBHOOK_SECRET:ipworld-dev-payment-webhook-secret}
app.orders.payment-timeout-minutes=${ORDER_PAYMENT_TIMEOUT_MIN:15}
app.orders.expiration-check-ms=${ORDER_EXPIRATION_CHECK_MS:60000}
app.outbox.poll-interval-ms=${OUTBOX_POLL_INTERVAL_MS:30000}

# Mail (KHÔNG hardcode mật khẩu thật trong source code — cấu hình qua biến môi trường)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Rate Limiting (Redis Atomic Lua Script + Caffeine/Bucket4j Fallback)
app.ratelimit.enabled=${RATE_LIMIT_ENABLED:true}
app.ratelimit.auth-requests-per-minute=${RATE_LIMIT_AUTH_RPM:15}
app.ratelimit.read-requests-per-second=${RATE_LIMIT_READ_RPS:60}
app.ratelimit.default-requests-per-second=${RATE_LIMIT_DEFAULT_RPS:20}
app.ratelimit.cache-max-size=${RATE_LIMIT_CACHE_MAX:50000}
app.ratelimit.cache-expire-minutes=${RATE_LIMIT_CACHE_TTL_MIN:10}

# Redis (1 Node) & Cache Configuration
# CACHE_TYPE=redis (production / khi bật Docker Redis) | caffeine (local không có Redis)
app.cache.type=${CACHE_TYPE:redis}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2s

# Async Email ThreadPool (@Async cho Email OTP & Outbox Fast-Path)
app.async.email.core-pool-size=${ASYNC_EMAIL_CORE_POOL:4}
app.async.email.max-pool-size=${ASYNC_EMAIL_MAX_POOL:16}
app.async.email.queue-capacity=${ASYNC_EMAIL_QUEUE_CAPACITY:500}

# Spring Boot Actuator & OpenAPI / Swagger UI
# Tắt mail health probe mặc định để container HEALTHCHECK không báo DOWN khi chưa cấu hình SMTP
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
management.health.mail.enabled=false
management.health.redis.enabled=${HEALTH_CHECK_REDIS:false}
springdoc.swagger-ui.path=/swagger-ui.html
