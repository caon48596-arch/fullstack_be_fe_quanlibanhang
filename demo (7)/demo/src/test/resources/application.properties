spring.application.name=demo-test
spring.docker.compose.enabled=false

# H2 In-Memory Database for testing
spring.datasource.url=jdbc:h2:mem:qlbanhang_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Chạy Flyway migration ngay trong bộ test để kiểm chứng khớp 100% giữa SQL và JPA Entity
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/{vendor}
spring.flyway.validate-on-migrate=true

# JWT Configuration (Access Token 15p + Refresh Token 7 ngày)
jwt.secret=8f8f9f1011121314151617181920212223242526272829303132333435363738
jwt.expiration=900000
jwt.refresh-expiration=604800000
app.cookie.secure=false

# CORS & Payment Webhook Test Config
app.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000
app.payment.webhook-secret=test-webhook-secret-key
app.orders.payment-timeout-minutes=15
app.orders.expiration-check-ms=3600000
app.outbox.poll-interval-ms=3600000

# Mail Configuration
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@example.com
spring.mail.password=testpassword

# Rate Limiting (ngưỡng cao hơn trong môi trường test tự động)
app.ratelimit.enabled=true
app.ratelimit.auth-requests-per-minute=500
app.ratelimit.read-requests-per-second=500
app.ratelimit.default-requests-per-second=500
app.ratelimit.cache-max-size=10000
app.ratelimit.cache-expire-minutes=5

# Dùng CaffeineCacheManager trong test tự động để kiểm chứng không cần Redis ngoài
app.cache.type=caffeine
management.health.mail.enabled=false
management.health.redis.enabled=false
